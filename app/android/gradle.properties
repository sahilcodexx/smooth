# This machine has 7 GB of RAM total, shared with the desktop, the browser and
# ADB. The Flutter template's default (-Xmx8G + 4G metaspace) asks for more
# memory than the whole machine, and the daemon gets OOM-killed mid-build.
# 2 GB is plenty for a single-module app and leaves room for everything else.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=192m -XX:+HeapDumpOnOutOfMemoryError

# Keep the daemon warm between builds so Gradle does not re-bootstrap each time.
org.gradle.daemon=true
org.gradle.daemon.idletimeout=3600000

# Build independent modules concurrently — the single biggest win on a 12-core box.
org.gradle.parallel=true

# Cache task outputs on disk so unchanged modules are skipped entirely on rebuild.
org.gradle.caching=true

# Only configure the modules a given task actually needs.
org.gradle.configureondemand=true

# Kotlin's compiler is incremental too; cap its own heap so it does not fight
# the Gradle daemon for memory.
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m

android.useAndroidX=true
# Smaller R class files: measurably faster incremental builds.
android.nonTransitiveRClass=true

# Added by the Flutter template; required by the current plugin.
android.newDsl=false
android.builtInKotlin=false